
    <figure class="photo p-$slug">
      <div class="photo-frame">$picture$arrows</div>
    </figure>
    <section class="photo-info">
      <div class="photo-text">
        <p class="crumb"><a href="/collections/$collection/">$collection_title</a></p>
        <h1>$title</h1>
        $caption
        <dl class="exif">$exif</dl>
        $gear
      </div>
      <div class="photo-buy">
        <a class="g-btn" href="$print_href">Buy a print</a>
        <a class="g-btn ghost" href="$license_href">License this image</a>
        <p class="note">Archival prints in several sizes. Licences for web,
        print and commercial use. <a href="/licensing/">Details</a></p>
      </div>
    </section>
    <nav class="pager" aria-label="More in this collection">$pager</nav>
